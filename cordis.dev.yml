# 本地调试用的 patch 覆盖层（不随包分发，也不被 package.json 的 dsh.bundle.patch 引用）。
#
# 作用：不把插件装进 profile，直接把工作区里的 lib/index.js 挂进一棵正在运行的树：
#   dsh <app> --patch "<本文件绝对路径>"
#
# name 用相对路径：dsh 会把 insert 行里 ./ 或 ../ 开头的 name **锚定在 patch 文件旁边**，
# 先 resolve 成绝对路径再转成 file URL，所以这里指向插件根目录下的 lib/index.js。
# 正式安装后改由 patches/bundle.yaml 用包名 dsh-github-top10 解析。
#
# id 特意与 bundle.yaml 里的 github-top10 不同（多一个 -dev）：两者是互斥的调试/安装两条路，
# 万一同时生效，报错会是「工具名重复」这种明确信息，而不是难查的重复行 id。
- insert:
    - id: github-top10-dev
      name: './lib/index.js'
